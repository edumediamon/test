<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>홈페이지</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
    }
    .card {
      background: rgba(255,255,255,0.9);
      color: #111827;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      width: min(90vw, 640px);
    }
    h1 { margin-top: 0; font-size: clamp(1.8rem, 3vw, 2.5rem); }
    p { line-height: 1.6; }
    .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: .75rem 1.25rem;
      border-radius: .6rem;
      text-decoration: none;
      font-weight: 600;
      background: #4f46e5;
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>환영합니다 👋</h1>
    <p>요청하신 기본 홈페이지를 만들었습니다.<br />
      이 파일은 <code>index.html</code> 하나로 구성되어 바로 열어볼 수 있습니다.</p>
    <a class="btn" href="#">시작하기</a>
  </main>
</body>
</html>
